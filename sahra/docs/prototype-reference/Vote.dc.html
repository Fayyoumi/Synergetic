<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Sahra who among us vote</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2B1B17}a:hover{color:#2B1B17}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 20px; background: #E8412C; color: #2B1B17; font-family: 'IBM Plex Sans Arabic', sans-serif; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-size: 14px; font-weight: 700; background: #FFF4DE; border: 2px solid #2B1B17; border-radius: 999px; padding: 4px 12px">الجولة ٣ من ٨</div>
<div style="font-family: 'Lalezar', sans-serif; font-size: 22px; background: #FFC93C; border: 2px solid #2B1B17; border-radius: 999px; padding: 2px 12px 0">٩ ثواني</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Lalezar', sans-serif; font-size: 28px; color: #FFF4DE">مين فينا…</div>
<div style="font-family: 'Lalezar', sans-serif; font-size: 40px; line-height: 1.2; color: #FFF4DE">أول واحد بينام بالسهرة؟</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{players}}" as="p" hint-placeholder-count="6">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="display: flex; align-items: center; gap: 10px; background: {{p.bg}}; color: #2B1B17; border: {{p.border}}; border-radius: 18px; padding: 12px; min-height: 64px; cursor: pointer; font-family: 'IBM Plex Sans Arabic', sans-serif; text-align: right">
<span style="width: 40px; height: 40px; border-radius: 50%; background: {{p.color}}; border: 2px solid #2B1B17; font-family: 'Lalezar', sans-serif; font-size: 20px; display: flex; align-items: center; justify-content: center; flex: none">{{p.initial}}</span>
<span style="flex: 1; font-weight: 700; font-size: 16px">{{p.name}}</span>
</button>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; align-items: flex-end; gap: 10px">
<svg viewBox="0 0 200 240" width="84" height="101" role="img" aria-label="Kassa" style="flex: none"><defs><clipPath id="kv1"><path d="M60 60 C55 100 75 120 70 150 C66 180 72 205 100 205 C128 205 134 180 130 150 C125 120 145 100 140 60 Z"/></clipPath></defs><g fill="none" stroke="#2B1B17" stroke-width="6" stroke-linecap="round"><path d="M85 44 C75 34 95 24 85 12"/><path d="M100 44 C90 31 110 21 100 6"/><path d="M115 44 C105 34 125 24 115 12"/></g><ellipse cx="100" cy="214" rx="72" ry="14" fill="#12A6A0" stroke="#2B1B17" stroke-width="6"/><path d="M60 60 C55 100 75 120 70 150 C66 180 72 205 100 205 C128 205 134 180 130 150 C125 120 145 100 140 60 Z" fill="#FFFDF7"/><rect x="40" y="92" width="120" height="120" fill="#D9541E" clip-path="url(#kv1)"/><path d="M60 60 C55 100 75 120 70 150 C66 180 72 205 100 205 C128 205 134 180 130 150 C125 120 145 100 140 60 Z" fill="none" stroke="#2B1B17" stroke-width="6" stroke-linejoin="round"/><ellipse cx="100" cy="60" rx="40" ry="8" fill="#FFFDF7" stroke="#2B1B17" stroke-width="6"/><circle cx="86" cy="124" r="10" fill="#FFFFFF" stroke="#2B1B17" stroke-width="4"/><circle cx="114" cy="124" r="10" fill="#FFFFFF" stroke="#2B1B17" stroke-width="4"/><circle cx="88" cy="126" r="4" fill="#2B1B17"/><circle cx="116" cy="126" r="4" fill="#2B1B17"/><path d="M74 106 Q84 98 96 104" stroke="#2B1B17" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M105 108 Q115 105 126 110" stroke="#2B1B17" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M84 142 Q92 135 100 141 Q108 135 116 142 Q108 147 100 144 Q92 147 84 142 Z" fill="#2B1B17"/><path d="M86 152 Q100 172 114 152 Z" fill="#2B1B17"/></svg>
<div style="background: #FFF4DE; border: 2px solid #2B1B17; border-radius: 20px 20px 4px 20px; padding: 12px 14px; font-weight: 600; font-size: 15px; line-height: 1.5">{{kassaLine}}</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: null };
}
renderVals() {
const picked = this.state.picked;
const raw = [
{ name: 'سارة', initial: 'س', color: '#E8412C' },
{ name: 'أبو عمر', initial: 'ع', color: '#FFC93C' },
{ name: 'كريم', initial: 'ك', color: '#12A6A0' },
{ name: 'نور', initial: 'ن', color: '#FFFFFF' },
{ name: 'يوسف', initial: 'ي', color: '#E8412C' },
{ name: 'تيتا', initial: 'ت', color: '#FFC93C' }
];
const players = raw.map((p, i) => ({
...p,
pressed: picked === i ? 'true' : 'false',
bg: picked === i ? '#FFC93C' : '#FFF4DE',
border: picked === i ? '4px solid #2B1B17' : '2px solid #2B1B17',
pick: () => this.setState({ picked: i })
}));
const kassaLine = picked === null ? 'صوّتوا بصراحة… وأنا بفضح النتيجة على الشاشة الكبيرة.' : 'صوتك لـ' + raw[picked].name + ' وصل. يا ويلهم!';
return { players, kassaLine };
}
}
</script>
</body>
</html>
