<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Sahra secret prompt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2B1B17;text-decoration:none}a:hover{color:#E8412C}
textarea:focus{outline:3px solid #12A6A0;outline-offset:2px}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 20px; background: #12A6A0; color: #2B1B17; font-family: 'IBM Plex Sans Arabic', sans-serif; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 50%; background: #FFF4DE; border: 2px solid #2B1B17; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2B1B17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
<div style="font-weight: 700; font-size: 15px">سهرة الجمعة · الشلة</div>
<div style="font-family: 'Lalezar', sans-serif; font-size: 20px; background: #FFF4DE; border: 2px solid #2B1B17; border-radius: 999px; padding: 2px 12px 0">{{progress}}</div>
</div>

<div style="display: flex; gap: 6px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><div style="flex: 1; height: 8px; border-radius: 4px; border: 2px solid #2B1B17; background: {{d.bg}}"></div></sc-for>
</div>

<sc-if value="{{inProgress}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFF4DE; border: 3px solid #2B1B17; border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em">سؤال سري · ما حدا بيشوف جوابك قبل السهرة</div>
<div style="font-family: 'Lalezar', sans-serif; font-size: 34px; line-height: 1.25">{{question}}</div>
<label for="answer" style="font-size: 14px; font-weight: 600">جوابك</label>
<textarea id="answer" value="{{text}}" onChange="{{onType}}" rows="3" placeholder="اكتب بصراحة… كاسة ما بيفضح إلا بالسهرة" style="font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 17px; line-height: 1.5; border: 2px solid #2B1B17; border-radius: 16px; padding: 12px 14px; resize: none; background: #FFFFFF; color: #2B1B17"></textarea>
</div>
<div style="display: flex; gap: 10px">
<button type="button" onClick="{{send}}" style="flex: 1; font-family: 'Lalezar', sans-serif; font-size: 22px; background: #FFC93C; color: #2B1B17; border: 2px solid #2B1B17; border-radius: 16px; min-height: 56px; padding-top: 4px; cursor: pointer">أرسل الجواب</button>
<button type="button" onClick="{{skip}}" style="font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 600; font-size: 15px; background: #FFF4DE; color: #2B1B17; border: 2px solid #2B1B17; border-radius: 16px; min-height: 56px; padding: 0 18px; cursor: pointer">تخطّى</button>
</div>
</div>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center">
<div style="font-family: 'Lalezar', sans-serif; font-size: 40px; line-height: 1.2">خلصت! ٥ من ٥</div>
<div style="font-size: 17px; line-height: 1.5; max-width: 300px">أسرارك محفوظة عند كاسة لحد ليلة الجمعة.</div>
<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; background: #2B1B17; color: #FFF4DE; border-radius: 16px; font-weight: 700; font-size: 16px">رجوع للرئيسية</a>
</div>
</sc-if>

<div style="display: flex; align-items: flex-end; gap: 10px">
<svg viewBox="0 0 200 240" width="84" height="101" role="img" aria-label="Kassa" style="flex: none"><defs><clipPath id="kp1"><path d="M60 60 C55 100 75 120 70 150 C66 180 72 205 100 205 C128 205 134 180 130 150 C125 120 145 100 140 60 Z"/></clipPath></defs><g fill="none" stroke="#2B1B17" stroke-width="6" stroke-linecap="round"><path d="M85 44 C75 34 95 24 85 12"/><path d="M100 44 C90 31 110 21 100 6"/><path d="M115 44 C105 34 125 24 115 12"/></g><ellipse cx="100" cy="214" rx="72" ry="14" fill="#FFC93C" stroke="#2B1B17" stroke-width="6"/><path d="M60 60 C55 100 75 120 70 150 C66 180 72 205 100 205 C128 205 134 180 130 150 C125 120 145 100 140 60 Z" fill="#FFFDF7"/><rect x="40" y="92" width="120" height="120" fill="#D9541E" clip-path="url(#kp1)"/><path d="M60 60 C55 100 75 120 70 150 C66 180 72 205 100 205 C128 205 134 180 130 150 C125 120 145 100 140 60 Z" fill="none" stroke="#2B1B17" stroke-width="6" stroke-linejoin="round"/><ellipse cx="100" cy="60" rx="40" ry="8" fill="#FFFDF7" stroke="#2B1B17" stroke-width="6"/><circle cx="86" cy="124" r="10" fill="#FFFFFF" stroke="#2B1B17" stroke-width="4"/><circle cx="114" cy="124" r="10" fill="#FFFFFF" stroke="#2B1B17" stroke-width="4"/><circle cx="84" cy="122" r="4" fill="#2B1B17"/><circle cx="112" cy="122" r="4" fill="#2B1B17"/><path d="M74 106 Q84 98 96 104" stroke="#2B1B17" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M105 108 Q115 105 126 110" stroke="#2B1B17" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M84 142 Q92 135 100 141 Q108 135 116 142 Q108 147 100 144 Q92 147 84 142 Z" fill="#2B1B17"/><path d="M86 152 Q100 172 114 152 Z" fill="#2B1B17"/></svg>
<div style="background: #FFF4DE; border: 2px solid #2B1B17; border-radius: 20px 20px 4px 20px; padding: 12px 14px; font-weight: 600; font-size: 15px; line-height: 1.5">{{kassaLine}}</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { answered: 3, text: '' };
}
renderVals() {
const questions = ['شو أغرب شي أكلته بحياتك؟', 'شو الكذبة اللي صدّقتها وإنت صغير لسنين؟'];
const digits = ['٠','١','٢','٣','٤','٥'];
const answered = this.state.answered;
const done = answered >= 5;
const lines = ['هالسؤال رح يعمل ضجة الجمعة… أنا متأكد.', 'آخر سؤال! وبعدين خلّي الباقي عليّ.', 'تمام. أنا ساكت… لليلة الجمعة بس.'];
const next = () => this.setState({ answered: Math.min(5, this.state.answered + 1), text: '' });
return {
done,
inProgress: !done,
question: done ? '' : questions[answered - 3],
progress: digits[Math.min(answered + (done ? 0 : 1), 5)] + ' / ٥',
dots: [0, 1, 2, 3, 4].map((i) => ({ bg: i < answered ? '#2B1B17' : '#FFF4DE' })),
text: this.state.text,
onType: (e) => this.setState({ text: e.target.value }),
send: next,
skip: next,
kassaLine: lines[answered - 3]
};
}
}
</script>
</body>
</html>
