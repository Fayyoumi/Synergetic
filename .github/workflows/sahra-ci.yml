name: Sahra CI

on:
  push:
    paths: ["sahra/**", ".github/workflows/sahra-ci.yml"]
  pull_request:
    paths: ["sahra/**", ".github/workflows/sahra-ci.yml"]

defaults:
  run:
    working-directory: sahra

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sahra/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:check
      - name: Unit + database tests
        run: npm test

      # End-to-end tests run against a local Supabase stack (Docker) with the
      # migrations and seed applied, exactly like `npx supabase start` locally.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,storage-api,postgres-meta,mailpit
      - name: Point the app at it
        run: ./scripts/local-env.sh
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
